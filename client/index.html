<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#231f2b" />
    <title>typo — the daily typing run</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Lilita+One&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="frame">
      <div id="game"></div>
      <div id="vignette"></div>

      <div id="hud-top">
        <div id="hud-score">0</div>
        <div id="hud-progress">
          <div id="hud-progress-bar"><div id="hud-progress-fill"></div></div>
          <div id="hud-progress-label">0/0</div>
        </div>
        <div id="hud-combo"></div>
      </div>

      <div id="word" class="hidden">
        <div id="word-tag"></div>
        <div id="word-letters"></div>
        <div id="word-timer"><div id="word-timer-fill"></div></div>
      </div>
      <div id="popups"></div>

      <div id="panel">
        <div id="panel-status"></div>
        <div id="keyboard"></div>
      </div>

      <div id="overlay"></div>
      <div id="grain"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
